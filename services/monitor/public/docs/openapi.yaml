openapi: 3.0.3

info:
  title: WeatherFlow Monitor API
  description: |
    API REST del servicio de monitoreo de WeatherFlow.
    Gestiona mediciones climáticas y evalúa alertas automáticas en base a umbrales.

    ## Reglas de alerta
    Las alertas se evalúan automáticamente al crear o actualizar una medición.
    Los umbrales son estrictos (los valores exactos **no** disparan alerta):

    | Condición                     | Tipo de alerta     |
    |-------------------------------|--------------------|
    | Temperatura > 40 °C           | Extreme Heat       |
    | Temperatura < 0 °C            | Frost              |
    | Presión atmosférica < 980 hPa | Storm              |
    | Humedad > 90 %                | Critical Humidity  |

    Una medición puede tener múltiples alertas activas simultáneamente.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8081/api
    description: Entorno de desarrollo local (Laravel Sail)

tags:
  - name: Measurements
    description: Registro y consulta de mediciones climáticas
  - name: Reports
    description: Reportes de agregación local sobre mediciones persistidas

paths:
  /measurements:
    get:
      tags: [Measurements]
      summary: Listar mediciones con filtros opcionales
      operationId: listMeasurements
      parameters:
        - name: station_name
          in: query
          required: false
          description: Filtrar por nombre de estación (búsqueda parcial)
          schema:
            type: string
          example: "Central"
        - name: temp_min
          in: query
          required: false
          description: Temperatura mínima (inclusive)
          schema:
            type: number
            format: float
          example: 10.0
        - name: temp_max
          in: query
          required: false
          description: Temperatura máxima (inclusive)
          schema:
            type: number
            format: float
          example: 35.0
        - name: humidity_min
          in: query
          required: false
          description: Humedad mínima (inclusive)
          schema:
            type: number
            format: float
          example: 40.0
        - name: humidity_max
          in: query
          required: false
          description: Humedad máxima (inclusive)
          schema:
            type: number
            format: float
          example: 90.0
        - name: pressure_min
          in: query
          required: false
          description: Presión atmosférica mínima (inclusive)
          schema:
            type: number
            format: float
          example: 980.0
        - name: pressure_max
          in: query
          required: false
          description: Presión atmosférica máxima (inclusive)
          schema:
            type: number
            format: float
          example: 1030.0
        - name: date_from
          in: query
          required: false
          description: Fecha/hora mínima de reporte (ISO 8601)
          schema:
            type: string
            format: date-time
          example: "2024-06-01T00:00:00Z"
        - name: date_to
          in: query
          required: false
          description: Fecha/hora máxima de reporte (ISO 8601)
          schema:
            type: string
            format: date-time
          example: "2024-06-30T23:59:59Z"
        - name: alert
          in: query
          required: false
          description: Filtrar solo mediciones con alerta activa (`true`) o sin alerta (`false`)
          schema:
            type: string
            enum: [true, false, "1", "0"]
          example: "true"
        - name: alert_type
          in: query
          required: false
          description: Filtrar por tipo de alerta específico
          schema:
            type: string
            enum: [none, extreme_heat, frost, storm, critical_humidity]
          example: "storm"
      responses:
        '200':
          description: Lista de mediciones filtradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'

    post:
      tags: [Measurements]
      summary: Registrar una medición
      description: |
        Registra una nueva medición y evalúa automáticamente las alertas.
        Si los valores superan los umbrales, `alertStatus` será `true` y
        `alertTypes` contendrá los tipos de alerta disparados.
      operationId: createMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeasurementRequest'
            example:
              station_id: "660e8400-e29b-41d4-a716-446655440001"
              temperature: 42.5
              humidity: 65.0
              atmospheric_pressure: 1013.25
              reported_at: "2024-06-15T14:30:00Z"
      responses:
        '201':
          description: Medición registrada. Las alertas se calculan automáticamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /measurements/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Measurements]
      summary: Obtener una medición por ID
      operationId: getMeasurement
      responses:
        '200':
          description: Medición encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Measurements]
      summary: Actualizar una medición
      description: Las alertas se recalculan automáticamente con los nuevos valores.
      operationId: updateMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeasurementRequest'
      responses:
        '200':
          description: Medición actualizada. Las alertas se recalculan automáticamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Measurements]
      summary: Eliminar una medición
      operationId: deleteMeasurement
      responses:
        '204':
          description: Medición eliminada correctamente
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/avg/day:
    get:
      tags: [Reports]
      summary: Promedio de temperatura de las últimas 24 horas
      description: |
        Calcula el promedio de temperatura de una estación en las últimas 24 horas
        a partir de las mediciones persistidas localmente. No realiza llamadas externas.
      operationId: getDailyAverageTemperature
      parameters:
        - name: station_id
          in: query
          required: true
          description: UUID de la estación meteorológica
          schema:
            type: string
            format: uuid
          example: "660e8400-e29b-41d4-a716-446655440001"
      responses:
        '200':
          description: Promedio calculado o sin datos en la ventana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AverageTemperatureReport'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /reports/avg/week:
    get:
      tags: [Reports]
      summary: Promedio de temperatura de los últimos 7 días
      description: |
        Calcula el promedio de temperatura de una estación en los últimos 7 días
        a partir de las mediciones persistidas localmente. No realiza llamadas externas.
      operationId: getWeeklyAverageTemperature
      parameters:
        - name: station_id
          in: query
          required: true
          description: UUID de la estación meteorológica
          schema:
            type: string
            format: uuid
          example: "660e8400-e29b-41d4-a716-446655440001"
      responses:
        '200':
          description: Promedio calculado o sin datos en la ventana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AverageTemperatureReport'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: UUID del recurso
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
          example:
            message: "Resource not found."

    UnprocessableEntity:
      description: Error de validación
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            message: "The given data was invalid."
            errors:
              station_id: ["The station id field is required."]

  schemas:
    Measurement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "770e8400-e29b-41d4-a716-446655440002"
        stationId:
          type: string
          format: uuid
          example: "660e8400-e29b-41d4-a716-446655440001"
        stationName:
          type: string
          example: "Estación Central"
        temperature:
          type: number
          format: float
          description: Temperatura en °C
          example: 42.5
        humidity:
          type: number
          format: float
          description: Humedad relativa en porcentaje (0-100)
          minimum: 0
          maximum: 100
          example: 65.0
        atmosphericPressure:
          type: number
          format: float
          description: Presión atmosférica en hPa (> 0)
          example: 1013.25
        reportedAt:
          type: string
          format: date-time
          description: Fecha y hora de la medición (ISO 8601)
          example: "2024-06-15T14:30:00+00:00"
        alertStatus:
          type: boolean
          description: true si al menos una alerta fue disparada
          example: true
        alertTypes:
          type: array
          description: Lista de tipos de alerta activos. Contiene "None" si no hay alertas
          items:
            type: string
            enum: [None, "Extreme Heat", Frost, Storm, "Critical Humidity"]
          example: ["Extreme Heat"]

    CreateMeasurementRequest:
      type: object
      required: [station_id, temperature, humidity, atmospheric_pressure, reported_at]
      properties:
        station_id:
          type: string
          format: uuid
          example: "660e8400-e29b-41d4-a716-446655440001"
        temperature:
          type: number
          format: float
          description: Temperatura en °C
          example: 42.5
        humidity:
          type: number
          format: float
          description: Humedad relativa (0-100)
          minimum: 0
          maximum: 100
          example: 65.0
        atmospheric_pressure:
          type: number
          format: float
          description: Presión atmosférica en hPa (debe ser > 0)
          example: 1013.25
        reported_at:
          type: string
          format: date-time
          description: Fecha y hora de la medición
          example: "2024-06-15T14:30:00Z"

    UpdateMeasurementRequest:
      type: object
      required: [temperature, humidity, atmospheric_pressure, reported_at]
      properties:
        temperature:
          type: number
          format: float
          description: Temperatura en °C
          example: 38.0
        humidity:
          type: number
          format: float
          description: Humedad relativa (0-100)
          minimum: 0
          maximum: 100
          example: 72.0
        atmospheric_pressure:
          type: number
          format: float
          description: Presión atmosférica en hPa (debe ser > 0)
          example: 975.0
        reported_at:
          type: string
          format: date-time
          description: Fecha y hora de la medición
          example: "2024-06-15T15:00:00Z"

    AverageTemperatureReport:
      type: object
      properties:
        stationId:
          type: string
          format: uuid
          description: UUID de la estación consultada
          example: "660e8400-e29b-41d4-a716-446655440001"
        window:
          type: string
          enum: [day, week]
          description: Ventana temporal del reporte
          example: "day"
        averageTemperature:
          type: number
          format: float
          nullable: true
          description: Promedio de temperatura en °C, o null si no hay mediciones en la ventana
          example: 22.5
        from:
          type: string
          format: date-time
          description: Inicio de la ventana temporal (ISO 8601)
          example: "2024-06-14T14:30:00+00:00"
        to:
          type: string
          format: date-time
          description: Fin de la ventana temporal (ISO 8601)
          example: "2024-06-15T14:30:00+00:00"
        message:
          type: string
          nullable: true
          description: Mensaje descriptivo cuando no hay mediciones en la ventana
          example: "No measurements found for this station in the requested time window."
