auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # trace_id se envía como structured metadata desde Promtail (campo filtrable
  # sin indexar como label).
  allow_structured_metadata: true
  # Habilita el histograma de volumen de logs en Grafana Explore.
  volume_enabled: true
  # Márgenes holgados para el entorno del TP (evita rechazos por antigüedad o
  # ráfagas durante los tests de ingesta).
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
