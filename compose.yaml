# Shared slim PHP runtime built once and reused by every PHP service.
# The app code is bind-mounted per service, so a single image serves all of them.
x-php-build: &php-build
  context: './docker/php'
  dockerfile: Dockerfile
  args:
    WWWGROUP: '${WWWGROUP:-1000}'

services:

  core:
    container_name: weatherflow-core
    build: *php-build
    image: 'weatherflow/php:8.4'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8081:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
      - './services/core:/var/www/html'
      - './services/core/docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
    networks:
      - weatherflow
    depends_on:
      - mongodb_core
      - redis

  monitor:
    container_name: weatherflow-monitor
    build: *php-build
    image: 'weatherflow/php:8.4'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8082:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
      - './services/monitor:/var/www/html'
    networks:
      - weatherflow
    depends_on:
      - mongodb_monitor
      - redis

  mongodb_core:
    container_name: mongodb_core
    image: 'mongo:7.0'
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'weatherflow'
      MONGO_INITDB_ROOT_PASSWORD: 'secret'
    volumes:
      - 'core-mongodb-data:/data/db'
    networks:
      - weatherflow

  mongodb_monitor:
    container_name: mongodb_monitor
    image: 'mongo:7.0'
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'weatherflow'
      MONGO_INITDB_ROOT_PASSWORD: 'secret'
    volumes:
      - 'monitor-mongodb-data:/data/db'
    networks:
      - weatherflow

  frontend:
    container_name: weatherflow-frontend
    image: nginx:alpine
    ports:
      - '3010:80'
    volumes:
      - './services/frontend:/usr/share/nginx/html:ro'
      - './services/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - weatherflow
    depends_on:
      - core
      - monitor

  redis:
    container_name: weatherflow-redis
    image: 'redis:7-alpine'
    ports:
      - '6380:6379'
    networks:
      - weatherflow

  monitor-worker:
    container_name: weatherflow-monitor-worker
    build: *php-build
    image: 'weatherflow/php:8.4'
    command: php artisan monitor:consume-station-events
    restart: unless-stopped
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - './services/monitor:/var/www/html'
    networks:
      - weatherflow
    depends_on:
      - rabbitmq
      - mongodb_monitor

  monitor-worker-raw:
    container_name: weatherflow-monitor-worker-raw
    build: *php-build
    image: 'weatherflow/php:8.4'
    command: php artisan monitor:consume-raw-measurements
    restart: unless-stopped
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - './services/monitor:/var/www/html'
    networks:
      - weatherflow
    depends_on:
      - rabbitmq
      - mongodb_monitor

  rabbitmq:
    container_name: weatherflow-rabbitmq
    image: 'rabbitmq:3-management-alpine'
    ports:
      - '5672:5672'
      - '15672:15672'
    expose:
      - '15692'
    environment:
      RABBITMQ_DEFAULT_USER: weatherflow
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - './observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro'
      - './observability/rabbitmq/20-prometheus.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro'
    networks:
      - weatherflow

  prometheus:
    container_name: weatherflow-prometheus
    image: 'prom/prometheus:v2.53.1'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    volumes:
      - './observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus-data:/prometheus'
    networks:
      - weatherflow

  grafana:
    container_name: weatherflow-grafana
    image: 'grafana/grafana:11.1.0'
    ports:
      # 3001 en el host: el 3000 lo ocupa el frontend nginx.
      - '3011:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - './observability/grafana/provisioning:/etc/grafana/provisioning:ro'
      - 'grafana-data:/var/lib/grafana'
    networks:
      - weatherflow
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    container_name: weatherflow-loki
    image: 'grafana/loki:3.1.0'
    command: '-config.file=/etc/loki/loki-config.yaml'
    volumes:
      - './observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro'
      - 'loki-data:/loki'
    networks:
      - weatherflow

  promtail:
    container_name: weatherflow-promtail
    image: 'grafana/promtail:3.1.0'
    command: '-config.file=/etc/promtail/promtail-config.yaml'
    volumes:
      - './observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro'
      - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - weatherflow
    depends_on:
      - loki

  tempo:
    container_name: weatherflow-tempo
    image: 'grafana/tempo:2.5.0'
    command: '-config.file=/etc/tempo/tempo-config.yaml'
    # La imagen corre como uid 10001, que no puede escribir el volumen recién creado.
    user: root
    volumes:
      - './observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro'
      - 'tempo-data:/var/tempo'
    networks:
      - weatherflow

  otel-collector:
    container_name: weatherflow-otel-collector
    image: 'otel/opentelemetry-collector-contrib:0.104.0'
    command: '--config=/etc/otelcol/config.yaml'
    expose:
      - '4317'
      - '4318'
      - '8888'
    volumes:
      - './observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro'
    networks:
      - weatherflow
    depends_on:
      - tempo

  cadvisor:
    container_name: weatherflow-cadvisor
    image: 'gcr.io/cadvisor/cadvisor:v0.49.1'
    privileged: true
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
    networks:
      - weatherflow

  node-exporter:
    container_name: weatherflow-node-exporter
    image: 'prom/node-exporter:v1.8.1'
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro'
    networks:
      - weatherflow

networks:
  weatherflow:
    driver: bridge

volumes:
  core-mongodb-data:
    driver: local
  monitor-mongodb-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
