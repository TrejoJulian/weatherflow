# Shared slim PHP runtime built once and reused by every PHP service.
# The app code is bind-mounted per service, so a single image serves all of them.
x-php-build: &php-build
  context: './docker/php'
  dockerfile: Dockerfile
  args:
    WWWGROUP: '${WWWGROUP:-1000}'

services:

  core:
    container_name: weatherflow-core
    build: *php-build
    image: 'weatherflow/php:8.4'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8080:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
      - './services/core:/var/www/html'
      - './services/core/docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
    networks:
      - weatherflow
    depends_on:
      - mongodb_core

  monitor:
    container_name: weatherflow-monitor
    build: *php-build
    image: 'weatherflow/php:8.4'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8081:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
      - './services/monitor:/var/www/html'
    networks:
      - weatherflow
    depends_on:
      - mongodb_monitor
      - redis

  mongodb_core:
    container_name: mongodb_core
    image: 'mongo:7.0'
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'weatherflow'
      MONGO_INITDB_ROOT_PASSWORD: 'secret'
    volumes:
      - 'core-mongodb-data:/data/db'
    networks:
      - weatherflow

  mongodb_monitor:
    container_name: mongodb_monitor
    image: 'mongo:7.0'
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'weatherflow'
      MONGO_INITDB_ROOT_PASSWORD: 'secret'
    volumes:
      - 'monitor-mongodb-data:/data/db'
    networks:
      - weatherflow

  frontend:
    container_name: weatherflow-frontend
    image: nginx:alpine
    ports:
      - '3000:80'
    volumes:
      - './services/frontend:/usr/share/nginx/html:ro'
      - './services/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - weatherflow
    depends_on:
      - core
      - monitor

  redis:
    container_name: weatherflow-redis
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    networks:
      - weatherflow

  monitor-worker:
    container_name: weatherflow-monitor-worker
    build: *php-build
    image: 'weatherflow/php:8.4'
    command: php artisan monitor:consume-station-events
    restart: unless-stopped
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - './services/monitor:/var/www/html'
    networks:
      - weatherflow
    depends_on:
      - rabbitmq
      - mongodb_monitor

  monitor-worker-raw:
    container_name: weatherflow-monitor-worker-raw
    build: *php-build
    image: 'weatherflow/php:8.4'
    command: php artisan monitor:consume-raw-measurements
    restart: unless-stopped
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - './services/monitor:/var/www/html'
    networks:
      - weatherflow
    depends_on:
      - rabbitmq
      - mongodb_monitor

  rabbitmq:
    container_name: weatherflow-rabbitmq
    image: 'rabbitmq:3-management-alpine'
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: weatherflow
      RABBITMQ_DEFAULT_PASS: secret
    networks:
      - weatherflow

networks:
  weatherflow:
    driver: bridge

volumes:
  core-mongodb-data:
    driver: local
  monitor-mongodb-data:
    driver: local
